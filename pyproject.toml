[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-agent"
version = "0.1.0"
description = "Transactional, tool-driven retail sales assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "openai>=1.50",
  "anthropic>=0.40,<1",
  "httpx>=0.27",
  "fastembed>=0.4",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "import-linter>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
extend-exclude = ["hello.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
  "fastembed.*",
  "openai.types.admin.*",
  "openai.types.beta.*",
  "openai.types.live.*",
  "openai.types.realtime.*",
  "openai.types.responses.*",
  "openai.lib.beta.*",
]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Dialect sqlite.*Decimal"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
  "app.api",
  "app.agent",
  "app.tools",
  "app.services",
  "app.rag",
  "app.llm | app.repo",
  "app.db",
  "app.domain",
  "app.core",
]
